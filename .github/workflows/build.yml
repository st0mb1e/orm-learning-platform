name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Checkstyle and tests
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Check Compose configuration
        run: docker compose --env-file .env.example --profile app config --quiet
      - name: Build Docker image
        run: docker build --tag learning-platform:test .
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: learning-platform
          path: target/learning-platform-1.0.0.jar
          if-no-files-found: error
