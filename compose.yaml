services:
  app:
    profiles: ["app"]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/learning_platform
      DB_USER: ${DB_USER:-learning}
      DB_PASSWORD: ${DB_PASSWORD:-learning}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: learning_platform
      POSTGRES_USER: ${DB_USER:-learning}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-learning}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d learning_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
